name: thaheen_task
description: A new Flutter project with Clean Architecture by Abdalluh Essam
# Flutter version on machine: 3.47.4
publish_to: 'none'

version: 0.0.0+0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc:
  shared_preferences:
  easy_localization:
  intl:
  equatable:
  flutter_screenutil:
  flutter_animate:
  flutter_native_splash:
  animate_do:
  lottie:
  google_fonts:
  flutter_launcher_icons:
  animator:
  flutter_svg:
  cupertino_icons:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_lints:
  flutter_gen_runner: 


flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    lottie: true


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/
    - assets/data/
    - assets/videos/
